<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Scamio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 border-r border-slate-800 bg-slate-900/50 flex flex-col justify-between hidden md:flex">
            <div class="p-6">
                <div class="flex items-center space-x-3 mb-8">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">S</div>
                    <span class="text-xl font-bold tracking-tight">Scamio OS</span>
                </div>
                <nav class="space-y-1">
                    <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-blue-600/10 text-blue-400 font-medium text-sm">🏠 Dashboard</a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 text-sm">📄 Documente</a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 text-sm">👥 Parteneri</a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 text-sm">💰 Financiar</a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 text-sm">⚙️ Setări</a>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
                Organizație: <span class="text-slate-300 font-medium">Demo SRL</span>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <!-- Top Header -->
            <header class="border-b border-slate-800 px-8 py-4 flex justify-between items-center bg-slate-900/20">
                <h1 class="text-lg font-semibold">Panou de control</h1>
                <div class="flex items-center gap-3">
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full">Sistem Activ</span>
                    <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold">ME</div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="p-8 max-w-5xl w-full mx-auto space-y-6">
                <!-- Welcome Banner -->
                <div class="bg-gradient-to-r from-blue-900/20 to-slate-900 border border-slate-800 rounded-2xl p-6">
                    <h2 class="text-2xl font-bold mb-2">Bună dimineața!</h2>
                    <p class="text-slate-400 text-sm">Iată sinteza activității pentru compania ta astăzi.</p>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-5">
                        <div class="text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Încasări Luna Aceasta</div>
                        <div class="text-2xl font-bold">12.450 RON</div>
                    </div>
                    <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-5">
                        <div class="text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Documente Procesate</div>
                        <div class="text-2xl font-bold">18 buc.</div>
                    </div>
                    <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-5">
                        <div class="text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Task-uri Active</div>
                        <div class="text-2xl font-bold text-blue-400">5</div>
                    </div>
                </div>

                <!-- AI Assistant Quick Prompt Box -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                    <div class="text-xs font-semibold text-slate-400 mb-2 flex items-center gap-2">
                        <span>🤖 Scamio AI Assistant</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" placeholder="Întreabă asistentul sau dă o comandă (ex: 'Arată-mi facturile emise')..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-600">
                        <button class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Trimite</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
