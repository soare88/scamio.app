<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scamio - AI Business OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <div class="min-h-screen flex flex-col justify-between">
        <!-- Header -->
        <header class="border-b border-slate-800 px-6 py-4 flex justify-between items-center max-w-6xl mx-auto w-full">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">S</div>
                <span class="text-xl font-bold tracking-tight">Scamio</span>
            </div>
            <div>
                <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full font-medium">În dezvoltare</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex items-center justify-center px-6 py-12">
            <div class="max-w-2xl text-center space-y-6">
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">
                    Platforma AI pentru <span class="text-blue-500">companiile din România</span>.
                </h1>
                <p class="text-slate-400 text-lg">
                    Un singur loc pentru documente, automatizări și inteligență artificială adaptată proceselor tale de business.
                </p>
                <div class="pt-4 flex justify-center gap-4">
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-left max-w-sm w-full">
                        <div class="text-xs text-slate-500 uppercase font-semibold mb-1">Status sistem</div>
                        <div class="text-sm text-slate-200 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            Pregătirea modulelor de business
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="border-t border-slate-800 text-center py-6 text-sm text-slate-500">
            &copy; 2026 Scamio. Toate drepturile rezervate.
        </footer>
    </div>
</body>
</html>
